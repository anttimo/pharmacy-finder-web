version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Same idea as min-release-age in .npmrc: skip brand-new releases.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    # @types/node must match the oldest Node we run on (CI and engines: 24).
    # Bump its major together with those, not on its own.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
